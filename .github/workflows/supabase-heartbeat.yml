name: Supabase Heartbeat – Kilometerregistratie

on:
  schedule:
    - cron: '0 8 * * 2,5'   # Elke dinsdag en vrijdag om 08:00 UTC
  workflow_dispatch:          # Ook handmatig te starten via GitHub UI

permissions:
  contents: write   # nodig om de keepalive-commit te kunnen pushen

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ping Supabase (INSERT)
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data '{"pinged_at": "now()"}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat")
          echo "INSERT status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ INSERT geslaagd."
          else
            echo "❌ INSERT mislukt: $STATUS"
            exit 1
          fi

      - name: Ping Supabase (DELETE)
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?id=gte.1")
          echo "DELETE status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ DELETE geslaagd."
          else
            echo "❌ DELETE mislukt: $STATUS"
            exit 1
          fi

      - name: Keepalive commit (reset GitHub 60-dagen inactiviteitstimer)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lege commit pushen met GITHUB_TOKEN telt als repo-activiteit,
          # maar triggert zelf geen nieuwe workflow-run (geen loop).
          git commit --allow-empty -m "chore: keepalive heartbeat $(date -u +%Y-%m-%d)"
          git push
